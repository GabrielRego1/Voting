# Local development database for the Voting API.
# POSTGRES_PASSWORD defaults to "voting" for local development only;
# override it with an environment variable (never commit real secrets).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: voting
      POSTGRES_USER: voting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voting}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voting -d voting"]
      interval: 2s
      timeout: 3s
      retries: 15
